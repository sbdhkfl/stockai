[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fairvalue-ai"
version = "0.1.0"
description = "FAIRVALUE AI — transparent, model-independent stock valuation engine"
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "FAIRVALUE AI contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
fairvalue = "fairvalue.cli:main"

[tool.setuptools.packages.find]
include = ["fairvalue*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
